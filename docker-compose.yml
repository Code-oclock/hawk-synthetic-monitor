services:
  monitor:
    build:
      context: .
      args:
        HTTPS_PROXY: ${BUILD_PROXY:-}
        HTTP_PROXY: ${BUILD_PROXY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-host.docker.internal,localhost}
    ports:
      - "127.0.0.1:8080:8080"
      - "8085:8085"
    volumes:
      - monitor-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  watchdog:
    profiles: ["watchdog"]
    build:
      context: .
      args:
        HTTPS_PROXY: ${BUILD_PROXY:-}
        HTTP_PROXY: ${BUILD_PROXY:-}
    entrypoint: ["watchdog"]
    restart: unless-stopped
    environment:
      TELEGRAM_NOTIFY_URL: ${TELEGRAM_NOTIFY_URL:?set TELEGRAM_NOTIFY_URL in .env}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      WATCHDOG_TIMEOUT: ${WATCHDOG_TIMEOUT:-25m}
    ports:
      - "127.0.0.1:8090:8090"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - monitor

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  monitor-data:
  prometheus-data:
  grafana-data:
