services:
  monitor:
    build:
      context: .
      args:
        HTTPS_PROXY: ${BUILD_PROXY:-}
        HTTP_PROXY: ${BUILD_PROXY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-host.docker.internal,localhost}
    ports:
      - "127.0.0.1:8080:8080"
      - "8085:8085"
    volumes:
      - monitor-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  monitor-data:
